services:
  super-minutes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super-minutes
    restart: unless-stopped
    ports:
      - "50822:3000"
    environment:
      WHISPER_GATEWAY_URL: http://whisper-gateway:5000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:e4b
      NODE_ENV: production
    networks:
      - infra-net

networks:
  infra-net:
    external: true
